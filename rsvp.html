<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le tue risposte · Marta e Filippo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Agbalumo&family=Nunito+Sans:ital,wght@0,400;0,600;0,800;1,400&display=swap">
<link rel="stylesheet" href="stile.css">
</head>
<body>
<header class="topbar"><a class="marchio" href="index.html">Marta <span>e</span> Filippo</a><nav class="nav"><a href="accedi.html">Cambia persona</a><a href="index.html">Torna al sito</a></nav></header>
<main>
<section class="banda azzurro">
  <div class="wrap stretto" id="app"><p class="tenue centro">Un momento…</p></div>
</section>
</main>
<footer class="piede"><p class="nomi">Marta <span class="e">e</span> Filippo</p><p>9 luglio 2027 · Monte Faito</p></footer>

<script src="config.js"></script>
<script src="comune.js"></script>
<script>
(function () {
  var C = window.Comune, esc = C.esc;
  var app = document.getElementById('app');
  var p = C.leggiProfilo();
  if (!p) { location.replace('accedi.html'); return; }
  var r = p.risposte || {};
  var nottiSalvate = String(r.notti || '').trim();

  // ---- testi che dipendono dal profilo ----
  function saluto() {
    var blocchi = [];
    if (p.dove === 'solo aperitivo') blocchi.push('<p class="lead centro">Ti aspettiamo sul Faito per la cerimonia e l’aperitivo del nostro matrimonio!</p>');
    else blocchi.push('<p class="lead centro">Ti aspettiamo sul Faito per il nostro matrimonio!</p>');
    if (p.stanza) {
      blocchi.push('<p class="lead centro">Abbiamo riservato per te una stanza a <b>' + esc(p.albergo) + '</b>' + (p.compagni ? ', insieme a <b>' + esc(p.compagni) + '</b>' : '') + '.</p>');
      // colonna "Indirizzo" del foglio: link di Google Maps (o indirizzo scritto) della struttura
      var indirizzo = String((p.colonne && (p.colonne.Indirizzo || p.colonne.indirizzo)) || '').trim();
      if (indirizzo) {
        var linkMappa = /^https?:\/\//i.test(indirizzo) ? indirizzo : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(indirizzo);
        blocchi.push('<div class="pulsanti"><a class="btn giallo" href="' + esc(linkMappa) + '" target="_blank" rel="noopener">Apri ' + esc(p.albergo) + ' su Google Maps</a></div>');
      }
      var prezzo = String(p.prezzo || (p.colonne && p.colonne.Prezzo) || '').trim().replace(/€/g, '').trim();
      if (prezzo) {
        blocchi.push('<p class="lead centro">Il costo della stanza è di <b>' + esc(prezzo) + '€ a notte a persona</b>. Se confermi, potrai pagare entro il <b>20 aprile 2027</b> con un bonifico a:</p>' +
          '<div class="iban"><p><b>Intestatario</b> Filippo Russomando &amp; Marta Giannetti</p>' +
          '<p><b>IBAN</b> <code id="iban">IT89 T036 6901 6008 1788 6466 950</code></p>' +
          '<p><b>Causale</b> Pagamento pernotto</p>' +
          '<button class="btn vuoto" type="button" id="copiaIban">Copia IBAN</button></div>');
      }
    }
    return blocchi.join('');
  }
  function radio(nome, opzioni, valore, obbl) {
    return '<div class="scelte">' + opzioni.map(function (o, i) {
      return '<label><input type="radio" name="' + nome + '" value="' + esc(o) + '"' + (valore === o ? ' checked' : '') + (obbl && i === 0 ? ' required' : '') + '> ' + esc(o) + '</label>';
    }).join('') + '</div>';
  }

  // ---- blocchi del form: compaiono in base al profilo ----
  var blocchi = [];

  blocchi.push('<div class="blocco"><h3>Ci sei?</h3>' +
    '<fieldset class="campo"><legend>Parteciperai' + (p.dove === 'solo aperitivo' ? ' alla cerimonia e all\'aperitivo' : '') + '?</legend>' +
    radio('conferma', ['Sì, ci sarò', 'Purtroppo no'], r.conferma === 'No' ? 'Purtroppo no' : (r.conferma ? 'Sì, ci sarò' : ''), true) + '</fieldset></div>');

  blocchi.push('<div class="blocco" data-se="si"><h3>Come ti raggiungiamo</h3>' +
    '<div class="campo"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" value="' + esc(r.email || '') + '"><p class="aiuto">Per eventuali comunicazioni prima del matrimonio.</p></div>' +
    '<div class="campo"><label for="telefono">Telefono</label><input id="telefono" name="telefono" type="tel" required autocomplete="tel" value="' + esc(r.telefono || '') + '"></div></div>');

  if (p.dove !== 'solo aperitivo') {
    var opzNotti = ['Venerdì 9', 'Sabato 10'];
    var nottiScelte = nottiSalvate.split(',').map(function (x) { return x.trim().toLowerCase(); });
    blocchi.push('<div class="blocco" data-se="si"><h3>Le notti</h3>' +
      '<fieldset class="campo"><legend>Quante notti ti fermi sul Faito?</legend><div class="scelte">' + opzNotti.map(function (n) {
        return '<label><input type="checkbox" name="notti" value="' + esc(n) + '"' + (nottiScelte.indexOf(n.toLowerCase()) !== -1 ? ' checked' : '') + '> ' + esc(n) + '</label>';
      }).join('') + '</div></fieldset></div>');
  }

  if (p.navetta) {
    blocchi.push('<div class="blocco" data-se="si"><h3>La navetta</h3><p>La navetta farà la tratta <b>Stazione di Napoli Centrale – Monte Faito</b> venerdì in tarda mattinata, e il ritorno <b>Monte Faito – Napoli Centrale</b> domenica in tarda mattinata.</p>' +
      '<fieldset class="campo"><legend>Vuoi usare la navetta?</legend>' + radio('navetta', ['Sì', 'No'], r.navetta || '', false) + '</fieldset></div>');
  }

  blocchi.push('<div class="blocco" data-se="si"><h3>A tavola</h3>' +
    '<div class="campo"><label for="allergie">Allergie, intolleranze o menù particolari</label><input id="allergie" name="allergie" type="text" value="' + esc(r.allergie || '') + '" placeholder="Es. vegetariano, senza glutine"><p class="aiuto">Lascia vuoto se nessuna.</p></div></div>');

  blocchi.push('<div class="blocco"><h3>Un messaggio per noi</h3>' +
    '<div class="campo"><label for="messaggio">Facoltativo</label><textarea id="messaggio" name="messaggio" rows="3">' + esc(r.messaggio || '') + '</textarea></div></div>');

  app.innerHTML = '<p class="etichetta centro">Conferma la tua presenza</p>' +
    '<h2 class="saluto centro">Ciao ' + esc(p.nome) + '!</h2>' +
    '<div class="intro-questionario">' + saluto() + '</div>' +
    (r.conferma ? '<p class="avviso">Hai già risposto: qui trovi le tue risposte, puoi modificarle e inviare di nuovo.</p>' : '') +
    '<form class="modulo" id="formRsvp" novalidate>' + blocchi.join('') +
    '<div class="pulsanti"><button class="btn" type="submit" id="invia">Invia le risposte</button></div>' +
    '<p class="avviso" id="esito" hidden></p></form>' +
    (C.MODALITA_PROVA ? '<p class="prova">Modalità prova: le risposte restano in questo browser, nulla viene scritto nel foglio.</p>' : '');

  var cb = document.getElementById('copiaIban'), ib = document.getElementById('iban');
  if (cb && ib) cb.addEventListener('click', function () {
    var t = ib.textContent.replace(/\s+/g, '');
    var ok = function () { cb.textContent = 'Copiato'; setTimeout(function () { cb.textContent = 'Copia IBAN'; }, 2000); };
    var fb = function () { var rg = document.createRange(); rg.selectNodeContents(ib); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok).catch(fb); else fb();
  });

  // blocchi che hanno senso solo se partecipa
  var form = document.getElementById('formRsvp');
  function aggiorna() {
    var c = form.querySelector('input[name="conferma"]:checked');
    var viene = !c || c.value.indexOf('Sì') === 0;
    form.querySelectorAll('[data-se="si"]').forEach(function (b) { b.hidden = !viene; });
  }
  form.addEventListener('change', aggiorna); aggiorna();

  var esito = document.getElementById('esito'), invia = document.getElementById('invia');
  function mostra(msg, tipo) { esito.textContent = msg; esito.className = 'avviso' + (tipo ? ' ' + tipo : ''); esito.hidden = false; esito.scrollIntoView({ block: 'nearest' }); }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var c = form.querySelector('input[name="conferma"]:checked');
    if (!c) { mostra('Dicci se parteciperai.', 'errore'); return; }
    var viene = c.value.indexOf('Sì') === 0;
    var ris = { conferma: viene ? 'Sì' : 'No', messaggio: form.messaggio.value.trim() };
    if (viene) {
      if (!form.email.value.trim() || !form.email.checkValidity()) { mostra('Serve un indirizzo email valido.', 'errore'); return; }
      if (!form.telefono.value.trim()) { mostra('Serve un numero di telefono.', 'errore'); return; }
      ris.email = form.email.value.trim(); ris.telefono = form.telefono.value.trim();
      ris.allergie = form.allergie.value.trim();
      var nts = Array.prototype.map.call(form.querySelectorAll('input[name="notti"]:checked'), function (i) { return i.value; });
      if (p.dove !== 'solo aperitivo' && nts.length === 0) { mostra('Dicci quali notti ti fermi.', 'errore'); return; }
      ris.notti = nts.join(', ');
      var nav = form.querySelector('input[name="navetta"]:checked'); ris.navetta = nav ? nav.value : '';
    }
    invia.disabled = true; invia.textContent = 'Invio…';
    C.api('salva', { token: p.token, nome: p.nome, cognome: p.cognome, risposte: ris }).then(function (resp) {
      invia.disabled = false; invia.textContent = 'Invia le risposte';
      if (resp.esito === 'ok') {
        p.risposte = Object.assign({}, r, ris); C.salvaProfilo(p);
        mostra(viene ? 'Grazie ' + p.nome + '! Abbiamo ricevuto le tue risposte. Tra un attimo torni al sito.' : 'Grazie ' + p.nome + ', ci dispiace che tu non possa esserci. Abbiamo registrato la risposta. Tra un attimo torni al sito.', 'ok');
        invia.disabled = true;
        setTimeout(function () { location.href = 'index.html'; }, 3500);
      } else {
        mostra('Non siamo riusciti a salvare (' + (resp.esito || 'errore') + '). Riprova tra poco.', 'errore');
      }
    }).catch(function () { invia.disabled = false; invia.textContent = 'Invia le risposte'; mostra('Non riesco a raggiungere il servizio. Controlla la connessione e riprova.', 'errore'); });
  });
})();
</script>
</body>
</html>
